; =============================================================================
; MentosArmyKnife-C3 — dispositivo de conscientização (treinamento autorizado)
; =============================================================================
; Plataforma de demonstração educativa: SoftAP isolado, captive portal
; informativo, dashboard do operador e observação wireless passiva.
;
; Princípios: ambiente isolado, dados sintéticos, NENHUMA coleta de
; credenciais reais. Veja docs/security.md e MentosArmyKnife-C3-PLANO.md.
;
; Gravar:   pio run -e mentos-c3 -t upload
; Filesys:  pio run -e mentos-c3 -t uploadfs   (envia data/ para LittleFS)
; Monitor:  pio device monitor -b 115200
; Testes:   pio test -e native                 (testes de host, sem hardware)
;
; ATENÇÃO: o board ID genérico pode não coincidir com o mapa de pinos/flash da
; ESP32-C3 SuperMini. Confirmar chip e flash com `esptool.py flash_id` antes de
; gravar (P0-01). Fixar versões (pin) só depois da primeira compilação estável.
; =============================================================================

[platformio]
default_envs = mentos-c3

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D MENTOS_C3=1
    ; TRAINING_MODE habilita logs de desenvolvimento no serial.
    ; Em release, defina 0 (ou remova) para silenciar a saída serial.
    -D TRAINING_MODE=1
    -D MAK_FW_VERSION=\"0.2.2-dev\"
    ; Headers do projeto são referenciados por caminho a partir de src/.
    -I src

[env:mentos-c3]
; Pin the Arduino 3.3.6 / IDF 5.5 platform used to validate the C3 build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
    ${env.build_flags}
    ; Roteia `Serial` para o USB Serial/JTAG nativo do C3 (porta /dev/ttyACM*),
    ; em vez da UART0 física. Necessário para o console serial funcionar via USB.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1

; -----------------------------------------------------------------------------
; Ambiente de teste no host (sem ESP32). Cobre lógica pura: máquina de estados,
; buffer de eventos e validação de configuração/allowlist.
; -----------------------------------------------------------------------------
[env:native]
platform = native @ 1.2.1
test_framework = unity
test_build_src = yes
; Só compila os módulos PUROS (sem Arduino) para os testes de host.
build_src_filter =
    +<core/Event.cpp>
    +<core/EventBus.cpp>
    +<core/StateMachine.cpp>
    +<core/TaskScheduler.cpp>
    +<security/ConfigValidation.cpp>
    +<storage/PcapBuffer.cpp>
build_flags =
    -D MAK_NATIVE_TEST=1
    -std=gnu++17
    -I src
    -I include
